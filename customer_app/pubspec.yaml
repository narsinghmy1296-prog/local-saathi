name: local_saathi_customer
description: Local Saathi — Customer Android app (Phase 7)
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Networking
  http: ^1.2.2

  # Secure JWT storage
  flutter_secure_storage: ^9.2.2

  # Small key/value cache (e.g. last-selected address id, locale pref)
  shared_preferences: ^2.3.2

  # Voice search — wraps Android SpeechRecognizer
  speech_to_text: ^7.0.0

  # Formatting (currency, dates)
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
